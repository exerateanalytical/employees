##############################################################################
#  PRICING COMPLETE REFERENCE
##############################################################################
pricing:
  model_overview: >
    OPES Health Systems sells software licences — customers own the software.
    All 21 clinical and administrative systems are installed directly on the
    hospital's or clinic's own infrastructure (on-premise). They also synchronise
    with an online server when connectivity is available.
    The ONLY subscription/SaaS product is OPESCare Health ID, which requires
    a live connection to the national interoperability layer.
    There is no SaaS model for EMR, HIS, Lab, Pharmacy, Radiology, or any
    specialist system — those are perpetual licences installed on-site.

  licensing_models:
    perpetual_on_premise:
      description: >
        One-time licence fee. Software is installed on the facility's own servers
        or computers. The facility owns the software permanently. Works fully
        offline. Synchronises with the facility's online server when internet is
        available. Annual maintenance contract (15–20%) covers updates and support.
      applies_to: "All 21 systems EXCEPT OPESCare Health ID"
    saas_subscription:
      description: >
        Monthly subscription. Hosted and managed by OPES. Requires internet
        connectivity. OPES handles infrastructure, updates, backups, and uptime.
      applies_to: "OPESCare Health ID ONLY (national interoperability layer)"
    hybrid:
      description: >
        On-premise perpetual licence + optional cloud synchronisation to a
        central server (facility's own cloud or OPES-managed). Data stays
        on-site; analytics and reporting are available centrally.
      applies_to: "Available for all perpetual-licence products"

  key_clarification_for_sales: >
    When prospects ask about pricing, always clarify:
    - They BUY the software (perpetual licence). They own it.
    - It is installed ON THEIR PREMISES — their servers, their infrastructure.
    - It works OFFLINE — no internet required for daily clinical operations.
    - It SYNCHRONISES to their online server when connectivity is available.
    - The only exception is OPESCare Health ID, which is subscription-based
      because it connects to the national health identity infrastructure.
    - Annual maintenance (15–20% of licence value) covers updates and support.

