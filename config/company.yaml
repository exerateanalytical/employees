##############################################################################
#  IDEAL CUSTOMER PROFILES (ICPs) — Based on $100M Leads framework
##############################################################################
ideal_customers:
  b2b:
    - segment: "Hospitals & Clinics"
      description: "Public and private hospitals, polyclinics, specialist centers"
      decision_maker: "Procurement Director, Medical Director, Hospital Administrator"
      pain_points:
        - "Inconsistent supply of quality medical products"
        - "High import costs and delays"
        - "Lack of reliable African suppliers"
        - "Regulatory compliance complexity"
      desired_outcome: "Reliable supply chain, quality products, competitive pricing, local support"
      budget_signal: "Purchasing manager with authority over XAF/USD budgets"

    - segment: "Government & Ministries of Health"
      description: "National MOH, district health offices, public health agencies"
      decision_maker: "Procurement officer, Director of Pharmacy, Minister/Deputy"
      pain_points:
        - "Budget constraints limiting healthcare access"
        - "Need for bulk supply and reliability"
        - "Regulatory and documentation requirements"
      desired_outcome: "Cost-effective solutions that serve the population at scale"

    - segment: "NGOs & International Health Organizations"
      description: "WHO, UNICEF, MSF, local NGOs running health programs"
      decision_maker: "Country Director, Supply Chain Manager, Program Officer"
      pain_points:
        - "Need for WHO/FDA-approved products"
        - "Local presence and support"
        - "Documentation for grant reporting"
      desired_outcome: "Trusted African partner with international certifications"

    - segment: "Pharmacies & Distributors"
      description: "Retail pharmacies, wholesale distributors, pharmacy chains"
      decision_maker: "Owner/Pharmacist, Purchasing Manager"
      pain_points:
        - "Product availability and consistency"
        - "Competitive wholesale pricing"
        - "Fast delivery and local support"
      desired_outcome: "Reliable wholesale partner with good margins and fast delivery"

  b2c:
    - segment: "Healthcare Professionals"
      description: "Doctors, nurses, midwives, lab technicians"
      pain_points:
        - "Need trusted, quality healthcare tools"
        - "Limited access to latest medical innovations"
      desired_outcome: "Professional-grade products at fair prices with local support"

    - segment: "Health-Conscious Consumers"
      description: "Urban middle-class Africans investing in their health"
      pain_points:
        - "Can't always trust product quality in local markets"
        - "Limited access to modern health products"
      desired_outcome: "Certified, effective health products delivered to their door"

##############################################################################
