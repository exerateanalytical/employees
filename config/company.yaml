products:

  # ── CORE PLATFORM (5 systems) ─────────────────────────────────────────────

  - id: "P001"
    number: 1
    name: "OPESCare"
    category: "Core Platform"
    full_name: "Universal Health ID & Interoperability Layer"
    role: "The backbone of the entire OPES ecosystem — sits at the centre of all 22 systems."
    description: >
      Assigns every patient a unique digital Health ID at their first point of contact.
      This identifier persists across all consultations, inter-facility transfers, and years —
      eliminating duplicate records and identification errors. OPESCare is the interoperability
      engine connecting all 22 systems via HL7 FHIR R4.
    modules:
      - "OPES Health ID — unique patient digital identifier assigned at first contact"
      - "Master Patient Index (MPI) — cross-facility record matching, duplicate detection, identity resolution"
      - "Health Information Exchange (HIE) — secure clinical data exchange across facilities"
      - "Referral Exchange — manages patient referrals and counter-referrals with documented follow-up"
      - "Provider Registry — directory of physicians, nurses, pharmacists, and specialists"
      - "Facility Registry — directory of all registered clinics, hospitals, laboratories, pharmacies"
      - "Patient Portal — patient-facing access to their own health records"
      - "Cross-Facility Record Access — any connected facility can access a patient's longitudinal record"
      - "Interoperability Services — API gateway for connecting third-party systems and government portals"
      - "Consent Management — patient consent recording, management, revocation, and auditing"
      - "Offline ID & Degraded Mode — functions without internet; syncs when connection returns"
      - "CRVS-compliant — aligned with Civil Registration and Vital Statistics systems"
      - "QR Identity — QR-based patient identification for fast intake"
    target_customer: "Ministries of Health, hospital networks, national health authorities"
    pricing:
      single_hospital: "From 25,000,000 FCFA"
      multi_hospital_network: "From 50,000,000 FCFA"
      national_programme: "On request"

