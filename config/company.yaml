##############################################################################
#  TECHNICAL ARCHITECTURE
##############################################################################
technical:
  primary_standard: "HL7 FHIR R4"
  api_format: "REST / OpenAPI 3.0 (JSON)"
  imaging: "DICOM (PACS-compatible)"
  diagnostic_coding: "ICD-10/ICD-11 with automated transition"
  clinical_terminology: "SNOMED CT"
  lab_coding: "LOINC"
  moh_reporting: "DHIS2-compatible exports"

  deployment_models:
    standard_on_premise:
      description: >
        The DEFAULT model for all 21 systems (everything except OPESCare Health ID).
        Software is installed on the facility's own servers or computers.
        The facility OWNS the software (perpetual licence). Works fully offline —
        no internet required for daily clinical operations. Synchronises
        automatically to the facility's own online server when connectivity
        is available. Data never leaves the facility without their control.
      best_for: "All hospitals, clinics, labs, pharmacies — any facility type"
    hybrid_sync:
      description: >
        On-premise installation + optional synchronisation to a central cloud server
        (the facility's own cloud, or OPES-managed hosting). Clinical staff work
        offline on-site; management and analytics are available online centrally.
      best_for: "Hospital networks, multi-site facilities, government health systems"
    opescare_subscription:
      description: >
        OPESCare Health ID is the ONLY subscription product. It requires internet
        because it connects to the national health identity and interoperability
        infrastructure (Master Patient Index, HIE, Provider Registry, etc.).
      best_for: "National programmes, hospital networks, Ministry of Health"
    note: >
      OPES does NOT operate a SaaS model for clinical systems. Hospitals and clinics
      install the software on-premise and own it. This gives them full data sovereignty,
      offline capability, and no dependency on OPES servers for daily operations.

  infrastructure:
    offline_mode: "Critical clinical data synchronized locally; replicates to central server on reconnection"
    data_centres: "Cameroon-based (Douala) for cloud deployments — data sovereignty compliance"
    high_availability: "Active-active configuration with automatic load balancing"
    backup: "Hourly backups; 30-day retention (daily); 12-month retention (monthly)"
    backup_encryption: "All backups encrypted and tested monthly"
    rpo: "< 1 hour (maximum acceptable data loss)"
    rto: "< 4 hours (maximum operational recovery time)"
    uptime_target: "99.9% on critical services"

  security:
    encryption: "AES-256 at rest; TLS 1.3 in transit"
    access_control: "RBAC — clinician, admin, nurse, technician, auditor roles"
    mfa: "Multi-factor authentication and SSO"
    audit_trail: "Immutable logging of every action; 24-month log retention"
    monitoring: "SIEM, anomaly detection, real-time alerts"
    incident_response: "24/7 on-call team; 72-hour breach notification; post-incident forensics"
    penetration_testing: "Quarterly"
    compliance: ["OHADA", "Cameroonian Health Data Law (2010/013 & 2010/021)", "HIPAA-aligned", "GDPR-aligned", "HL7 FHIR R4", "Bilingual (Constitution of Cameroon)"]

