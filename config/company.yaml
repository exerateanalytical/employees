company:
  name: "OPES Health Systems"
  website: "https://opeshealthsystems.com"
  tagline: "Africa's Most Complete Healthcare Operating System"
  mission: >
    To digitise and integrate healthcare delivery across Africa through a unified,
    interoperable ecosystem of 22 clinical and administrative software systems —
    making quality healthcare data-driven, accessible, and accountable from triage
    to billing, in every language and every facility.
  vision: >
    A fully connected African healthcare system where every patient has a universal
    health identity, every clinician has the tools they need, and every Ministry of
    Health has real-time data to make life-saving decisions.
  company_type: "Digital Health SaaS"
  hq_country: "Cameroon"
  hq_city: "Yaoundé / Douala"
  founded: "2020s"
  standard: "HL7 FHIR (Fast Healthcare Interoperability Resources)"
  languages:
    primary: "English"
    secondary: "French"
    note: >
      All 22 systems are fully bilingual EN/FR by design — essential for Cameroon
      (bilingual nation) and the broader CEMAC region (4 Francophone + 2 Anglophone).

  contact:
