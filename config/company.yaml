    - name: "East Africa"
      countries: [Kenya, Tanzania, Ethiopia, Uganda, Rwanda, Burundi, Somalia, Djibouti]
      priority: 3
    - name: "Southern Africa"
      countries: [South Africa, Zimbabwe, Zambia, Mozambique, Angola, Botswana, Namibia]
      priority: 4
    - name: "North Africa"
      countries: [Egypt, Morocco, Algeria, Tunisia, Libya]
      priority: 5

  market_notes: >
    Africa has 1.4 billion people, rapidly growing middle class, increasing
    health awareness, mobile-first digital adoption, and massive underserved
    healthcare markets. 70%+ of health expenditure is out-of-pocket.
    Key decision-makers include Ministry of Health officials, hospital
    procurement managers, pharmacists, and individual consumers.

