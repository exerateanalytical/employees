##############################################################################
#  MISSION, VISION & VALUES
##############################################################################
mission: >
  To eliminate fragmented healthcare information, improve continuity of care, and
  empower healthcare professionals across Africa with modern, interoperable digital
  tools that improve clinical outcomes and operational efficiency — starting from
  Cameroon and the CEMAC region.

vision: >
  A CEMAC region where every patient has a universal Health ID and their complete
  medical record follows them seamlessly — from first contact at a village health
  post through specialist care at a teaching hospital — all connected through the
  OPESCare interoperability layer.

values:
  patient_first: "Every feature, workflow, and design decision starts with: does this make care better for the patient?"
  trust_through_data_security: "Patient data is treated as sacred. Industry-standard encryption, role-based access, and audit trails on every system."
  built_for_africa: "Not adapted — designed. Offline-capable, bilingual, CNPS-aware, and priced for the African health market."
  long_term_partnership: "Success is measured by how long facilities stay with OPES and how much their operations improve."

